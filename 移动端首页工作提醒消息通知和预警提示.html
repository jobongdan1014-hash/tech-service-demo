<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>技术服务机构工作台</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-light: #e6f4ff;
      --danger: #ff4d4f;
      --danger-light: #fff1f0;
      --warning: #faad14;
      --warning-light: #fff7e6;
      --success: #52c41a;
      --success-light: #f6ffed;
      --purple: #722ed1;
      --purple-light: #f9f0ff;
      --cyan: #13c2c2;
      --cyan-light: #e6fffb;
      --orange: #fa8c16;
      --orange-light: #fff7e6;
      --text: #1f1f1f;
      --text-2: #595959;
      --text-3: #8c8c8c;
      --text-4: #bfbfbf;
      --bg: #f5f5f5;
      --white: #fff;
      --border: #f0f0f0;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      max-width: 430px; margin: 0 auto; min-height: 100vh; overflow-x: hidden;
    }
    .page { display:none; min-height:100vh; flex-direction:column; }
    .page.active { display:flex; }

    .header {
      background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
      color: #fff; padding: 48px 20px 14px; position: sticky; top: 0; z-index: 100;
    }
    .header-title { font-size:17px; font-weight:600; text-align:center; }
    .header-back {
      position:absolute; left:12px; top:46px; background:none; border:none;
      color:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:2px; padding:4px;
    }
    .header-back svg { width:20px; height:20px; }

    /* 首页：面板内页签（浅蓝底 + 选中白底与列表衔接） */
    #page-home .home-shell { flex:1; padding:12px 16px 24px; min-height:0; }
    #page-home .home-panel {
      background:var(--white); border-radius:12px; overflow:hidden;
      box-shadow:0 2px 12px rgba(0,0,0,.08);
    }
    #page-home .main-tabs.home-panel-tabs {
      display:flex; background:#e8f4ff; padding:8px 8px 0; gap:4px;
      border-bottom:none; position:static;
    }
    #page-home .main-tab {
      flex:1; text-align:center; padding:10px 6px 12px; font-size:14px; color:var(--text-2);
      cursor:pointer; position:relative; border:none; font-family:inherit; transition:background .2s,color .2s;
      border-radius:8px 8px 0 0; background:transparent;
    }
    #page-home .main-tab.active {
      background:var(--white); color:var(--primary); font-weight:600;
    }
    #page-home .main-tab.active::after { display:none; }
    #page-home .main-tab .tab-badge {
      position:absolute; top:4px; right:calc(50% - 36px);
      min-width:16px; height:16px; padding:0 4px; border-radius:8px;
      background:var(--danger); color:#fff; font-size:10px; line-height:16px; text-align:center;
    }
    #page-home .home-panel-body { background:var(--white); }
    #page-home .home-tab-pane { padding:0; }
    /* 必须与 .active 同时生效，否则去掉 active 后仍被 display:flex 撑开，会盖住详情页 */
    #page-home.page.active { display:flex; flex-direction:column; min-height:100vh; }

    /* 首页列表行（虚线分隔、非独立卡片） */
    .home-list { background:var(--white); }
    .home-list-row {
      display:flex; align-items:center; gap:10px; padding:12px 14px;
      border-bottom:1px dotted #d9d9d9; cursor:pointer; transition:background .12s;
    }
    .home-list-row:active { background:#fafafa; }
    .home-list-row:last-of-type { border-bottom:none; }
    .home-list-row-icon {
      width:36px; height:36px; border-radius:8px; display:flex;
      align-items:center; justify-content:center; flex-shrink:0;
    }
    .home-list-row-icon svg { width:20px; height:20px; }
    .home-list-row-mid { flex:1; min-width:0; }
    .home-list-row-cat { font-size:14px; font-weight:600; color:var(--text); margin-bottom:4px; line-height:1.3; }
    .home-list-row-snippet {
      font-size:12px; color:var(--text-3); line-height:1.35;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .home-list-row-meta { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
    .home-list-row-time { font-size:12px; color:var(--text-4); white-space:nowrap; }
    .home-list-row .home-unread-dot {
      width:6px; height:6px; border-radius:50%; background:var(--danger);
    }
    .home-view-more-wrap {
      border-top:1px dotted #f0f0f0; padding:12px 0 14px; text-align:center;
    }
    .btn-more.home-more-link {
      display:inline-flex; align-items:center; gap:4px; padding:0; border:none; background:none;
      color:var(--text-3); font-size:13px; font-weight:400; box-shadow:none;
    }
    .btn-more.home-more-link svg { width:14px; height:14px; color:var(--text-4); }
    .btn-more.home-more-link:active { opacity:.7; background:transparent; }
    #page-home .home-empty { padding:40px 16px; text-align:center; color:var(--text-4); font-size:13px; }

    .sub-tabs { display:flex; background:var(--white); padding:0 16px; gap:4px; border-bottom:1px solid var(--border); }
    .sub-tab {
      padding:11px 14px; font-size:13px; color:var(--text-3); cursor:pointer;
      position:relative; border:none; background:none; font-family:inherit; white-space:nowrap; transition:color .2s;
    }
    .sub-tab.active { color:var(--primary); font-weight:600; }
    .sub-tab.active::after {
      content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
      width:100%; height:2px; background:var(--primary); border-radius:1px;
    }
    .sub-tab .cnt {
      display:inline-block; color:#fff; font-size:10px; font-weight:600;
      padding:1px 5px; border-radius:9px; margin-left:3px; vertical-align:middle;
    }

    .content { flex:1; padding:12px 16px 80px; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }

    .card-list { display:flex; flex-direction:column; gap:10px; }
    .card {
      background:var(--white); border-radius:12px; padding:14px; display:flex;
      align-items:flex-start; gap:12px; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s;
    }
    .card:active { transform:scale(0.98); }
    .card-icon {
      width:40px; height:40px; border-radius:10px; display:flex;
      align-items:center; justify-content:center; flex-shrink:0;
    }
    .card-icon svg { width:20px; height:20px; }
    .card-body { flex:1; min-width:0; }
    .card-type { font-size:12px; color:var(--text-3); margin-bottom:3px; display:flex; align-items:center; gap:6px; }
    .badge { font-size:11px; padding:1px 6px; border-radius:4px; font-weight:500; }
    .badge-pending { background:var(--warning-light); color:#d46b08; }
    .badge-done { background:var(--success-light); color:#389e0d; }
    .badge-unread { background:var(--primary-light); color:var(--primary); }
    .badge-read { background:#f5f5f5; color:var(--text-3); }
    .card-title { font-size:14px; font-weight:500; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .card-time { font-size:12px; color:var(--text-4); margin-top:4px; }
    .card-arrow { color:var(--text-4); flex-shrink:0; align-self:center; }
    .card .unread-dot {
      width:8px; height:8px; border-radius:50%; background:var(--danger);
      flex-shrink:0; margin-top:6px;
    }

    .view-more-wrap { padding:16px 0 24px; text-align:center; }
    .btn-more {
      display:inline-flex; align-items:center; gap:5px; padding:10px 28px;
      border:1px solid var(--primary); border-radius:22px; background:var(--white);
      color:var(--primary); font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; transition:all .2s;
    }
    .btn-more:active { background:var(--primary-light); }
    .btn-more svg { width:14px; height:14px; }

    .empty { display:flex; flex-direction:column; align-items:center; padding:60px 0; color:var(--text-4); }
    .empty svg { width:64px; height:64px; margin-bottom:12px; opacity:.35; }
    .empty p { font-size:13px; }

    /* Detail */
    .detail-section { background:var(--white); border-radius:12px; padding:18px 16px; margin-bottom:10px; box-shadow:var(--shadow); }
    .detail-title { font-size:16px; font-weight:600; line-height:1.5; margin-bottom:14px; }
    .detail-meta { display:flex; flex-direction:column; gap:10px; }
    .detail-row { display:flex; font-size:13px; line-height:1.5; }
    .detail-label { color:var(--text-3); width:72px; flex-shrink:0; }
    .detail-value { flex:1; color:var(--text); word-break:break-all; }
    .detail-content { font-size:14px; line-height:1.8; color:#434343; }
    .detail-section h4 { font-size:14px; font-weight:600; margin-bottom:10px; }

    .action-bar {
      position:fixed; bottom:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:430px; background:var(--white);
      padding:10px 16px max(10px, env(safe-area-inset-bottom));
      box-shadow:0 -2px 8px rgba(0,0,0,.06); display:flex; gap:10px; z-index:100;
    }
    .btn {
      flex:1; padding:11px 0; border-radius:8px; font-size:14px; font-weight:500;
      cursor:pointer; border:none; font-family:inherit; transition:opacity .2s;
    }
    .btn:active { opacity:.7; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-outline { background:var(--white); color:var(--text); border:1px solid #d9d9d9; }
    .btn-danger-outline { background:var(--white); color:var(--danger); border:1px solid var(--danger); }
    .btn-success { background:var(--success); color:#fff; }
    .btn-disabled { background:#f5f5f5; color:var(--text-4); cursor:default; }

    /* Rating */
    .rating { display:flex; gap:8px; justify-content:center; margin:16px 0; }
    .rating .star { width:32px; height:32px; cursor:pointer; color:#d9d9d9; transition:color .15s; }
    .rating .star.active { color:var(--warning); }

    .toast {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      background:rgba(0,0,0,.75); color:#fff; padding:12px 24px; border-radius:8px;
      font-size:14px; z-index:9999; pointer-events:none; opacity:0; transition:opacity .3s;
    }
    .toast.show { opacity:1; }

    /* Dialog overlay */
    .dialog-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200;
      display:none; align-items:flex-end; justify-content:center;
    }
    .dialog-overlay.show { display:flex; }
    .dialog-box {
      background:var(--white); border-radius:16px 16px 0 0; width:100%; max-width:430px;
      padding:24px 20px max(20px, env(safe-area-inset-bottom)); animation:slideUp .25s ease-out;
    }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .dialog-box h3 { font-size:16px; font-weight:600; margin-bottom:16px; text-align:center; }
    .dialog-box textarea {
      width:100%; height:100px; border:1px solid #d9d9d9; border-radius:8px;
      padding:10px; font-size:14px; font-family:inherit; resize:none; margin-bottom:16px;
    }
    .dialog-box .dialog-btns { display:flex; gap:10px; }
    .dialog-box .dialog-btns .btn { flex:1; }

    /* Handle Info Section */
    .handle-section { background:var(--white); border-radius:12px; padding:18px 16px; margin-bottom:10px; box-shadow:var(--shadow); border-left:3px solid var(--success); }
    .handle-section.rejected { border-left-color:var(--danger); }
    .handle-section h4 { font-size:14px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
    .handle-section h4 svg { width:16px; height:16px; }

    /* AI Tip */
    .ai-tip {
      display:flex; gap:10px; align-items:flex-start;
      background:linear-gradient(135deg, #f0f5ff 0%, #e6f7ff 100%);
      border:1px solid #bae0ff; border-radius:12px;
      padding:14px 16px; margin-bottom:10px;
    }
    .ai-tip-icon {
      width:36px; height:36px; border-radius:50%;
      background:linear-gradient(135deg, #597ef7 0%, #1677ff 100%);
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .ai-tip-icon svg { width:20px; height:20px; color:#fff; }
    .ai-tip-body { flex:1; }
    .ai-tip-label { font-size:12px; font-weight:600; color:#1677ff; margin-bottom:4px; }
    .ai-tip-text { font-size:13px; line-height:1.6; color:#434343; }

    /* Review Links */
    .review-links { display:flex; flex-direction:column; gap:8px; }
    .review-link {
      display:flex; align-items:flex-start; gap:10px; padding:12px 14px;
      background:#fafafa; border:1px solid var(--border); border-radius:8px;
      cursor:pointer; transition:all .15s; font-size:14px; color:var(--primary);
    }
    .review-link:active { background:#f0f0f0; }
    .review-link .rl-check {
      width:20px; height:20px; border-radius:50%; border:2px solid #d9d9d9;
      display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; margin-top:2px;
    }
    .review-link.viewed .rl-check { border-color:var(--success); background:var(--success); }
    .review-link.viewed .rl-check svg { display:block; }
    .review-link .rl-check svg { display:none; width:12px; height:12px; color:#fff; }
    .review-link .rl-name { flex:1; }
    .review-link .rl-arrow { color:var(--text-4); flex-shrink:0; align-self:center; }
    .review-link.viewed { color:var(--text-2); border-color:#e8e8e8; }
    .review-link--iot:not(.viewed) { border-color:#ffccc7; background:linear-gradient(90deg,#fff2f0 0%,#fff 100%); }
    .review-link--iot-empty:not(.viewed) { border-color:#ffd591; background:linear-gradient(90deg,#fffbe6 0%,#fff 100%); }
    .rl-main { flex:1; display:flex; flex-direction:column; gap:4px; min-width:0; }
    .rl-iot-remind { font-size:12px; color:#ff4d4f; font-weight:600; line-height:1.4; }
    .rl-iot-remind--guide { color:#d46b08; }
    .review-progress { font-size:12px; color:var(--text-3); margin-top:6px; text-align:right; }

    /* 物联告警列表页 */
    .iot-alarm-card {
      background:var(--white); border-radius:12px; padding:14px 16px; margin-bottom:10px;
      box-shadow:var(--shadow); border-left:3px solid #ff4d4f;
    }
    .iot-alarm-card .iot-row { display:flex; font-size:13px; line-height:1.55; margin-bottom:8px; }
    .iot-alarm-card .iot-row:last-child { margin-bottom:0; }
    .iot-alarm-card .iot-label { color:var(--text-3); width:80px; flex-shrink:0; }
    .iot-alarm-card .iot-val { flex:1; color:var(--text); word-break:break-all; }
    .iot-alarm-card .iot-title { font-size:14px; font-weight:600; color:var(--text); margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border); }

    .iot-empty-wrap { text-align:center; padding:24px 16px 32px; }
    .iot-empty-wrap .iot-empty-icon {
      width:72px; height:72px; margin:0 auto 16px; border-radius:50%;
      background:linear-gradient(135deg,#fff7e6,#fffbe6); border:2px dashed #ffd591;
      display:flex; align-items:center; justify-content:center; color:#fa8c16;
    }
    .iot-empty-wrap .iot-empty-icon svg { width:36px; height:36px; }
    .iot-empty-wrap h3 { font-size:16px; font-weight:600; color:var(--text); margin-bottom:10px; }
    .iot-empty-wrap p { font-size:13px; color:var(--text-3); line-height:1.65; margin-bottom:20px; text-align:left; }
    .btn-iot-bind {
      display:inline-block; width:100%; max-width:280px; padding:12px 20px; border-radius:8px;
      border:none; background:var(--primary); color:#fff; font-size:15px; font-weight:500;
      cursor:pointer; font-family:inherit; box-shadow:0 2px 8px rgba(22,119,255,.35);
    }
    .btn-iot-bind:active { opacity:.88; }

    /* Contact Picker */
    .contact-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
    .contact-item {
      display:flex; align-items:center; gap:10px; padding:12px 14px;
      border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:all .15s;
    }
    .contact-item:active { background:#f5f5f5; }
    .contact-item.selected { border-color:var(--primary); background:var(--primary-light); }
    .contact-avatar {
      width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#597ef7,#1677ff);
      display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:600; flex-shrink:0;
    }
    .contact-info { flex:1; }
    .contact-name { font-size:14px; font-weight:500; }
    .contact-role { font-size:12px; color:var(--text-3); margin-top:2px; }
    .contact-check { width:20px; height:20px; color:var(--primary); display:none; }
    .contact-item.selected .contact-check { display:block; }

    /* Search & Filter Bar */
    .search-filter-bar { background:var(--white); padding:12px 16px 8px; }
    .search-box {
      display:flex; align-items:center; background:#f5f5f5; border-radius:8px;
      padding:0 12px; height:36px; gap:8px;
    }
    .search-box svg { width:16px; height:16px; color:var(--text-4); flex-shrink:0; }
    .search-box input {
      flex:1; border:none; background:none; outline:none; font-size:13px;
      font-family:inherit; color:var(--text); height:100%;
    }
    .search-box input::placeholder { color:var(--text-4); }
    .search-box .search-clear {
      width:18px; height:18px; border-radius:50%; background:#d9d9d9; border:none;
      display:none; align-items:center; justify-content:center; cursor:pointer; padding:0; flex-shrink:0;
    }
    .search-box .search-clear svg { width:12px; height:12px; color:#fff; }
    .search-box .search-clear.show { display:flex; }
    .filter-row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
    .filter-chip {
      display:inline-flex; align-items:center; gap:4px; padding:5px 12px;
      border-radius:16px; font-size:12px; cursor:pointer; border:1px solid #e8e8e8;
      background:var(--white); color:var(--text-2); font-family:inherit; transition:all .15s;
      white-space:nowrap;
    }
    .filter-chip.active { border-color:var(--primary); background:var(--primary-light); color:var(--primary); font-weight:500; }
    .filter-chip svg { width:12px; height:12px; }
    .filter-dropdown-wrap { position:relative; }
    .filter-dropdown {
      position:absolute; top:calc(100% + 4px); left:0; z-index:50;
      background:var(--white); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.12);
      padding:6px 0; min-width:140px; max-height:260px; overflow-y:auto; display:none;
    }
    .filter-dropdown.show { display:block; }
    .filter-dropdown .fd-item {
      padding:9px 16px; font-size:13px; color:var(--text-2); cursor:pointer; display:flex;
      align-items:center; justify-content:space-between; transition:background .1s;
    }
    .filter-dropdown .fd-item:active { background:#f5f5f5; }
    .filter-dropdown .fd-item.active { color:var(--primary); font-weight:500; }
    .filter-dropdown .fd-item.active::after { content:'✓'; color:var(--primary); font-size:14px; }
    .search-result-info { padding:4px 0 2px; font-size:12px; color:var(--text-3); }

    @keyframes slideInRight { from{transform:translateX(100%)} to{transform:translateX(0)} }
    @keyframes slideInLeft { from{transform:translateX(-30%);opacity:.5} to{transform:translateX(0);opacity:1} }
    .slide-in { animation:slideInRight .25s ease-out; }
    .slide-back { animation:slideInLeft .2s ease-out; }
  </style>
</head>
<body>

<!-- ===== Page: Home ===== -->
<div class="page active" id="page-home">
  <div class="header"><div class="header-title">技术服务工作台</div></div>
  <div class="home-shell">
    <div class="home-panel">
      <div class="main-tabs home-panel-tabs" id="main-tabs">
        <button class="main-tab active" data-tab="work">工作提醒<span class="tab-badge" id="badge-work"></span></button>
        <button class="main-tab" data-tab="message">消息通知<span class="tab-badge" id="badge-message"></span></button>
        <button class="main-tab" data-tab="alert">预警提示<span class="tab-badge" id="badge-alert"></span></button>
      </div>
      <div class="home-panel-body">
        <div class="tab-content home-tab-pane active" id="tab-work">
          <div class="home-list" id="home-list-work"></div>
          <div class="home-view-more-wrap"><button type="button" class="btn-more home-more-link" data-cat="work">查看更多 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div>
        </div>
        <div class="tab-content home-tab-pane" id="tab-message">
          <div class="home-list" id="home-list-message"></div>
          <div class="home-view-more-wrap"><button type="button" class="btn-more home-more-link" data-cat="message">查看更多 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></div>
        </div>

// ============================== HELPERS ==============================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function showPage(id, anim) {
  $$('.page').forEach(p => p.classList.remove('active','slide-in','slide-back'));
  const pg = $(`#${id}`);
  pg.classList.add('active');
  if (anim) pg.classList.add(anim);
}

function catLabel(cat) { return {work:'工作提醒',message:'消息通知',alert:'预警提示'}[cat]; }
function statusLabel(item) {
  if (item.cat === 'work') return item.status === 'pending' ? '未处理' : '已处理';
  return item.status === 'pending' ? '未读' : '已读';
}
function statusBadgeClass(item) {
  if (item.cat === 'work') return item.status === 'pending' ? 'badge-pending' : 'badge-done';
  return item.status === 'pending' ? 'badge-unread' : 'badge-read';
}
function pendingCount(cat) { return allItems.filter(i => i.cat === cat && i.status === 'pending').length; }

function stampHandle(item, result) {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  item.handleResult = result;
  item.handleUser = '张伟';
  item.handleRole = '委托单位管理员';
  item.handleTime = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

// ============================== RENDER CARD ==============================
function renderCard(item, showBadge) {
  const tg = TAGS[item.tag];
  const dot = (item.status === 'pending' && !showBadge) ? '<div class="unread-dot"></div>' : '';
  const badge = showBadge ? `<span class="badge ${statusBadgeClass(item)}">${statusLabel(item)}</span>` : '';
  return `<div class="card" data-id="${item.id}">
    <div class="card-icon" style="background:${tg.bg};color:${tg.color}">${tg.icon}</div>
    <div class="card-body">
      <div class="card-type">${tg.label} ${badge}</div>
      <div class="card-title">${item.title}</div>
      <div class="card-time">${item.time}</div>
    </div>
    ${dot}
    <div class="card-arrow">${I.arrowR}</div>
  </div>`;
}

function formatRelativeTime(timeStr) {
  const t = new Date(timeStr.replace(/-/g, '/'));
  const now = new Date('2026-03-16 15:00:00');
  const diff = now - t;
  if (diff < 0 || isNaN(diff)) return timeStr.slice(0, 16);
  const m = Math.floor(diff / 60000);
  const h = Math.floor(diff / 3600000);
  const d = Math.floor(diff / 86400000);
  if (m < 60) return m <= 0 ? '刚刚' : `${m}分钟前`;
  if (h < 24) return `${h}小时前`;
  if (d < 7) return `${d}天前`;
  return timeStr.slice(0, 16);
}

function renderHomeRow(item) {
  const tg = TAGS[item.tag];
  const unread = item.status === 'pending' ? '<span class="home-unread-dot"></span>' : '';
  return `<div class="home-list-row" data-id="${item.id}">
    <div class="home-list-row-icon" style="background:${tg.bg};color:${tg.color}">${tg.icon}</div>
    <div class="home-list-row-mid">
      <div class="home-list-row-cat">${tg.label}</div>
      <div class="home-list-row-snippet">${item.title}</div>
    </div>
    <div class="home-list-row-meta">
      ${unread}
      <span class="home-list-row-time">${formatRelativeTime(item.time)}</span>
    </div>
  </div>`;
}

// ============================== HOME ==============================
function renderHome() {
  ['work','message','alert'].forEach(cat => {
    const items = allItems.filter(i => i.cat === cat && i.status === 'pending');
    const list = $(`#home-list-${cat}`);
    const show = items.slice(0, 5);
    list.innerHTML = show.length ? show.map(i => renderHomeRow(i)).join('') :
      `<div class="home-empty"><p>暂无待处理的${catLabel(cat)}</p></div>`;
    const cnt = pendingCount(cat);
    const badge = $(`#badge-${cat}`);
    badge.textContent = cnt;
    badge.style.display = cnt > 0 ? 'block' : 'none';
  });
}

// ============================== FULL LIST ==============================
function getTagsForCat(cat) {
  const catItems = allItems.filter(i => i.cat === cat);
  const seen = new Set();
  return catItems.map(i => i.tag).filter(t => { if (seen.has(t)) return false; seen.add(t); return true; });
}

function matchesTimeFilter(item) {
  if (!filterTime) return true;
  const d = new Date(item.time.replace(/-/g, '/'));
  const now = new Date('2026/03/16 23:59:59');
  const diff = now - d;
  const day = 86400000;
  if (filterTime === '3d') return diff <= 3 * day;
  if (filterTime === '7d') return diff <= 7 * day;
  if (filterTime === '30d') return diff <= 30 * day;
  return true;
}

function renderFullList() {
  const cat = currentListCat;
  const isWork = cat === 'work';
  const labels = isWork
    ? [{key:'pending',label:'未处理'},{key:'done',label:'已处理'},{key:'all',label:'全部'}]
    : [{key:'pending',label:'未读'},{key:'done',label:'已读'},{key:'all',label:'全部'}];

  const catItems = allItems.filter(i => i.cat === cat);
  const counts = {
    pending: catItems.filter(i => i.status === 'pending').length,
    done: catItems.filter(i => i.status === 'done').length,
    all: catItems.length,
  };

  const colors = { pending:'#ff4d4f', done:'#52c41a', all:'#8c8c8c' };
  $('#sub-tabs').innerHTML = labels.map(l =>
    `<button class="sub-tab${currentSubTab===l.key?' active':''}" data-status="${l.key}">${l.label} <span class="cnt" style="background:${colors[l.key]}">${counts[l.key]}</span></button>`
  ).join('');
  $('#list-title').textContent = catLabel(cat);

  let filtered = catItems;
  if (currentSubTab === 'pending') filtered = filtered.filter(i => i.status === 'pending');
  else if (currentSubTab === 'done') filtered = filtered.filter(i => i.status === 'done');

  if (searchKeyword) {
    const kw = searchKeyword.toLowerCase();
    filtered = filtered.filter(i => i.title.toLowerCase().includes(kw) || i.content.toLowerCase().includes(kw));
  }
  if (filterTag) filtered = filtered.filter(i => i.tag === filterTag);
  if (filterTime) filtered = filtered.filter(matchesTimeFilter);

  const info = $('#search-result-info');
  if (searchKeyword || filterTag || filterTime) {
    info.style.display = 'block';
    info.textContent = `共找到 ${filtered.length} 条结果`;
  } else {
    info.style.display = 'none';
  }

  const list = $('#full-list');
  list.innerHTML = filtered.length
    ? filtered.map(i => renderCard(i, true)).join('')
    : `<div class="empty"><p>暂无数据</p></div>`;

  $$('#sub-tabs .sub-tab').forEach(tab => {
    tab.onclick = () => {
      currentSubTab = tab.dataset.status;
      renderFullList();
    };
  });

  renderFilterDropdowns(cat);
}

function renderFilterDropdowns(cat) {
  const tags = getTagsForCat(cat);
  const tagDropdown = $('#filter-tag-dropdown');
  tagDropdown.innerHTML = `<div class="fd-item${!filterTag?' active':''}" data-val="">全部类型</div>` +
    tags.map(t => `<div class="fd-item${filterTag===t?' active':''}" data-val="${t}">${TAGS[t].label}</div>`).join('');

  tagDropdown.querySelectorAll('.fd-item').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      filterTag = el.dataset.val;
      const btn = $('#filter-tag-btn');
      $('#filter-tag-text').textContent = filterTag ? TAGS[filterTag].label : '消息类型';
      btn.classList.toggle('active', !!filterTag);
      tagDropdown.classList.remove('show');
      renderFullList();
    };
  });

  const timeOptions = [{val:'',label:'全部时间'},{val:'3d',label:'近3天'},{val:'7d',label:'近7天'},{val:'30d',label:'近30天'}];
  const timeDropdown = $('#filter-time-dropdown');
  timeDropdown.innerHTML = timeOptions.map(o =>
    `<div class="fd-item${filterTime===o.val?' active':''}" data-val="${o.val}">${o.label}</div>`
  ).join('');

  timeDropdown.querySelectorAll('.fd-item').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      filterTime = el.dataset.val;
      const btn = $('#filter-time-btn');
      const picked = timeOptions.find(o => o.val === filterTime);
      $('#filter-time-text').textContent = filterTime ? picked.label : '时间范围';
      btn.classList.toggle('active', !!filterTime);
      timeDropdown.classList.remove('show');
      renderFullList();
    };
  });
}

    ${item.act === ACT.evaluate && item.status === 'pending' && !isPracticeFb ? renderRatingSection() : ''}`;

  renderActionBar(item);
  bindReviewLinks(item, tg);
}

function renderIotAlarmPage(item) {
  const alarms = item.iotAlarms || [];
  const el = $('#iot-alarm-content');
  if (!alarms.length) {
    el.innerHTML = `
      <div class="iot-empty-wrap">
        <div class="iot-empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <h3>暂无异动信息</h3>
        <p>当前项目尚未关联物联建筑，系统无法采集物联侧告警数据。请先完成<strong>物联建筑关联</strong>后，即可在此查看物联告警与异动信息。</p>
        <button type="button" class="btn-iot-bind" id="btn-iot-bind-building">去关联物联建筑</button>
      </div>`;
    const btn = $('#btn-iot-bind-building');
    if (btn) {
      btn.onclick = () => showToast('已跳转至「物联建筑关联」配置（演示）');
    }
    return;
  }
  el.innerHTML = alarms.map((a, i) => `
    <div class="iot-alarm-card">
      <div class="iot-title">异动信息 ${i + 1}</div>
      <div class="iot-row"><span class="iot-label">设备号</span><span class="iot-val">${a.deviceNo || ''}</span></div>
      <div class="iot-row"><span class="iot-label">设备类型</span><span class="iot-val">${a.deviceType || ''}</span></div>
      <div class="iot-row"><span class="iot-label">位置描述</span><span class="iot-val">${a.location || ''}</span></div>
      <div class="iot-row"><span class="iot-label">报警事件</span><span class="iot-val">${a.event || ''}</span></div>
      <div class="iot-row"><span class="iot-label">报警状态</span><span class="iot-val">${a.status || ''}</span></div>
    </div>
  `).join('');
}

function renderReviewLinks(item, tg) {
  if (!tg.reviewLinks || !tg.reviewLinks.length) return '';
  const viewed = item._viewedLinks || {};
  const total = tg.reviewLinks.length;
  const doneCount = tg.reviewLinks.filter(l => viewed[l]).length;
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const alarms = item.iotAlarms || [];
  const alarmCount = alarms.length;
  const links = tg.reviewLinks.map(name => {
    const done = !!viewed[name];
    const isIot = name === LINK_IOT_ALARM;
    let iotRemind = '';
    let iotCls = '';
    if (isIot) {
      if (!done && alarmCount > 0) {
        iotRemind = `<span class="rl-iot-remind">有${alarmCount}个异动信息可查看</span>`;
        iotCls = ' review-link--iot';
      } else if (!done && alarmCount === 0) {
        iotRemind = `<span class="rl-iot-remind rl-iot-remind--guide">暂未关联物联建筑</span>`;
        iotCls = ' review-link--iot review-link--iot-empty';
      }
    }
    return `<div class="review-link${done ? ' viewed' : ''}${iotCls}" data-link="${name}">
      <div class="rl-check">${checkSvg}</div>
      <div class="rl-main">
        <span class="rl-name">${name}</span>
        ${iotRemind}
      </div>
      <span class="rl-arrow">${I.arrowR}</span>
    </div>`;
  }).join('');
  const allDone = doneCount === total;
  const secTitle = tg.reviewSectionTitle || '查看详情';
  let pendingHint = '';
  if (item.status === 'pending' && !allDone) {
    if (item.act === ACT.evaluate) pendingHint = '<div class="review-progress" style="color:var(--text-3)">建议先点击上方链接查看执业详情与物联告警</div>';
    else pendingHint = '<div class="review-progress">请查看全部内容后方可进行同意操作</div>';
  }
  return `<div class="detail-section" id="review-links-section">
    <h4>${secTitle} <span style="font-weight:400;font-size:12px;color:${allDone?'var(--success)':'var(--warning)'}">（${allDone?'已全部查看':`${doneCount}/${total}`}）</span></h4>
    <div class="review-links" id="review-links">${links}</div>
    ${pendingHint}
  </div>`;
}

function bindReviewLinks(item, tg) {
  if (!tg.reviewLinks || !tg.reviewLinks.length) return;
  const links = $$('#review-links .review-link');
  links.forEach(el => {
    el.onclick = () => {
      const name = el.dataset.link;
      if (name === LINK_IOT_ALARM) {
        iotAlarmSourceItem = item;
        renderIotAlarmPage(item);
        showPage('page-iot-alarm', 'slide-in');
        return;
      }
      if (!item._viewedLinks) item._viewedLinks = {};
      item._viewedLinks[name] = true;
      showToast(`已查看「${name}」`);
      setTimeout(() => renderDetail(item), 400);
    };
  });
}

const CONTACTS = [
  { name:'刘建国', role:'项目经理' },
  { name:'张敏',   role:'安全主管' },
  { name:'李志远', role:'设施管理员' },
  { name:'王芳',   role:'行政负责人' },
];

function showContactPicker(item, afterPick) {
  const overlay = $('#dialog-overlay');
  const box = $('#dialog-box');
  let selected = '';
  box.innerHTML = `
    <h3>选择项目对接人</h3>
    <div class="contact-list" id="contact-list">
      ${CONTACTS.map(c => `<div class="contact-item" data-name="${c.name}">
        <div class="contact-avatar">${c.name[0]}</div>
        <div class="contact-info"><div class="contact-name">${c.name}</div><div class="contact-role">${c.role}</div></div>
        <svg class="contact-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>`).join('')}
    </div>
    <div class="dialog-btns">
      <button class="btn btn-outline" id="cpCancel">取消</button>
      <button class="btn btn-disabled" id="cpConfirm" disabled>确认选择</button>
    </div>`;
  overlay.classList.add('show');
  $('#cpCancel').onclick = () => overlay.classList.remove('show');
  $$('#contact-list .contact-item').forEach(el => {
    el.onclick = () => {
      $$('#contact-list .contact-item').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      selected = el.dataset.name;
      const btn = $('#cpConfirm');
      btn.disabled = false;
      btn.className = 'btn btn-primary';
    };
  });
  $('#cpConfirm').onclick = () => {
    if (!selected) return;
    overlay.classList.remove('show');
    afterPick(selected);
  };
}

function renderHandleInfo(item) {
  if (!item.handleResult) return '';
  const isReject = item.handleResult !== '同意';
  const cls = isReject ? 'handle-section rejected' : 'handle-section';
  const icon = isReject
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
  const color = isReject ? 'var(--danger)' : 'var(--success)';
  let extraHandleRows = '';
  if (item.handleReason) extraHandleRows += `<div class="detail-row"><span class="detail-label">处理备注</span><span class="detail-value">${item.handleReason}</span></div>`;
  if (item.handleContact) extraHandleRows += `<div class="detail-row"><span class="detail-label">项目对接人</span><span class="detail-value">${item.handleContact}</span></div>`;
  return `<div class="${cls}">
    <h4 style="color:${color}">${icon} 处理信息</h4>
    <div class="detail-meta">
      <div class="detail-row"><span class="detail-label">处理状态</span><span class="detail-value"><span class="badge" style="background:${isReject?'var(--danger-light);color:var(--danger)':'var(--success-light);color:var(--success)'}">${item.handleResult}</span></span></div>
      <div class="detail-row"><span class="detail-label">操作人员</span><span class="detail-value">${item.handleUser}</span></div>
      <div class="detail-row"><span class="detail-label">操作角色</span><span class="detail-value">${item.handleRole}</span></div>
      <div class="detail-row"><span class="detail-label">操作时间</span><span class="detail-value">${item.handleTime}</span></div>
      ${extraHandleRows}
    </div>
  </div>`;
}

function renderRatingSection() {
  return `<div class="detail-section" id="rating-section">
    <h4>服务评价</h4>
    <div class="rating" id="rating-stars">
      ${[1,2,3,4,5].map(n => `<svg class="star" data-val="${n}" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`).join('')}
    </div>
    <p style="text-align:center;font-size:12px;color:var(--text-3)" id="rating-text">请选择评分</p>
  </div>`;
}

let currentRating = 0;
function bindRatingStars() {
  const stars = $$('#rating-stars .star');
  if (!stars.length) return;
  const labels = ['','非常不满意','不满意','一般','满意','非常满意'];
  stars.forEach(s => {
    s.onclick = () => {
      currentRating = parseInt(s.dataset.val);
      stars.forEach((ss, i) => ss.classList.toggle('active', i < currentRating));
      $('#rating-text').textContent = labels[currentRating];
    };
  });
}

function renderActionBar(item) {
  const bar = $('#action-bar');
  if (item.status === 'done') {
    const label = item.cat === 'work' ? '已处理' : '已读';
    bar.innerHTML = `<button class="btn btn-disabled" disabled>${label}</button>`;
    return;
  }

  switch (item.act) {
    case ACT.approve_reject: {
      const tgCfg = TAGS[item.tag];
      const hasLinks = tgCfg.reviewLinks && tgCfg.reviewLinks.length;
      const allViewed = hasLinks ? tgCfg.reviewLinks.every(l => item._viewedLinks && item._viewedLinks[l]) : true;
      if (hasLinks && !allViewed) {
        bar.innerHTML = `<button class="btn btn-danger-outline" id="actReject">拒 绝</button><button class="btn btn-disabled" disabled title="请先查看全部内容">同 意</button>`;
      } else {
        bar.innerHTML = `<button class="btn btn-danger-outline" id="actReject">拒 绝</button><button class="btn btn-primary" id="actApprove">同 意</button>`;
        $('#actApprove').onclick = () => {
          if (hasLinks) {
            showContactPicker(item, (contact) => {
              item.status = 'done';
              stampHandle(item, '同意');
              item.handleContact = contact;
              showToast('已同意，项目对接人：' + contact);
              setTimeout(() => { renderDetail(item); renderFullList(); renderHome(); }, 500);
            });
          } else {
            item.status = 'done';
            stampHandle(item, '同意');
            showToast('已同意');
            setTimeout(() => { renderDetail(item); renderFullList(); renderHome(); }, 500);
          }
        };
      }
      $('#actReject').onclick = () => showRejectDialog(item);
      break;
    }
    case ACT.approve_return:
      bar.innerHTML = `<button class="btn btn-outline" id="actReturn">驳 回</button><button class="btn btn-primary" id="actApprove2">同 意</button>`;
      $('#actApprove2').onclick = () => {
        item.status = 'done';
        stampHandle(item, '同意');
        showToast('已同意');
        setTimeout(() => { renderDetail(item); renderFullList(); renderHome(); }, 500);
      };
      $('#actReturn').onclick = () => showRejectDialog(item, '驳回');
      break;
    case ACT.go_operate:
      bar.innerHTML = `<button class="btn btn-primary" id="actGo">去操作</button>`;
      $('#actGo').onclick = () => {
        item.status = 'done';
        showToast('操作成功');
        setTimeout(() => { renderDetail(item); renderFullList(); renderHome(); }, 500);
      };
      break;
    case ACT.evaluate:
      bar.innerHTML = `<button class="btn btn-primary" id="actEval">前往评价</button>`;
      if (item.tag === 'practice_fb') {
        $('#actEval').onclick = () => {
          item.status = 'done';
          showToast('已前往评价');
          setTimeout(() => { renderDetail(item); renderFullList(); renderHome(); }, 500);
        };
      } else {
        setTimeout(bindRatingStars, 50);
        $('#actEval').onclick = () => {
          if (currentRating === 0) { showToast('请先选择评分'); return; }
          item.status = 'done';
          showToast('评价提交成功');
          currentRating = 0;
          setTimeout(() => { renderDetail(item); renderFullList(); renderHome(); }, 500);
        };
      }
      break;
    case ACT.view_detail:
      bar.innerHTML = `<button class="btn btn-primary" id="actRead">标记已读</button>`;
      $('#actRead').onclick = () => {
        item.status = 'done';
        showToast('已标记');
        setTimeout(() => { renderDetail(item); renderFullList(); renderHome(); }, 500);
      };
      break;
    case ACT.mark_read:
      bar.innerHTML = `<button class="btn btn-primary" id="actMark">标记已读</button>`;
      $('#actMark').onclick = () => {
        item.status = 'done';
        showToast('已标记已读');
        setTimeout(() => { renderDetail(item); renderFullList(); renderHome(); }, 500);
      };
      break;
  }
}

// ============================== REJECT / RETURN DIALOG ==============================
function showRejectDialog(item, label = '拒绝') {
  const overlay = $('#dialog-overlay');
  const box = $('#dialog-box');
  box.innerHTML = `
    <h3>${label}原因</h3>
    <textarea placeholder="请输入${label}原因（选填）" id="rejectReason"></textarea>
    <div class="dialog-btns">
      <button class="btn btn-outline" id="dlgCancel">取消</button>
      <button class="btn btn-primary" id="dlgConfirm">确认${label}</button>
    </div>`;
  overlay.classList.add('show');
  $('#dlgCancel').onclick = () => overlay.classList.remove('show');
  $('#dlgConfirm').onclick = () => {
    overlay.classList.remove('show');
    item.status = 'done';
    stampHandle(item, label);
    item.handleReason = ($('#rejectReason').value || '').trim();
    showToast(`已${label}`);
    setTimeout(() => { renderDetail(item); renderFullList(); renderHome(); }, 500);
  };
}

// ============================== EVENTS ==============================

// Main tabs
$$('.main-tab').forEach(tab => {
  tab.onclick = () => {
    $$('.main-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMainTab = tab.dataset.tab;
    $$('.tab-content').forEach(c => c.classList.remove('active'));
    $(`#tab-${currentMainTab}`).classList.add('active');
  };
});

// View more
function resetFilters() {
  searchKeyword = ''; filterTag = ''; filterTime = '';
  const si = $('#search-input');
  if (si) si.value = '';
  const sc = $('#search-clear');
  if (sc) sc.classList.remove('show');
  const tb = $('#filter-tag-btn');
  if (tb) { tb.classList.remove('active'); $('#filter-tag-text').textContent = '消息类型'; }
  const tmb = $('#filter-time-btn');
  if (tmb) { tmb.classList.remove('active'); $('#filter-time-text').textContent = '时间范围'; }
}
$$('.btn-more').forEach(btn => {
  btn.onclick = () => {
    currentListCat = btn.dataset.cat;
    currentSubTab = 'pending';
    resetFilters();
    renderFullList();
    navStack = ['page-home'];
    showPage('page-list', 'slide-in');
  };
});

// Back to home
$('#btn-back-home').onclick = () => {
  navStack = [];
  renderHome();
  showPage('page-home', 'slide-back');
};

// Back from detail
$('#btn-back-list').onclick = () => {
  const prev = navStack.pop();
  if (prev === 'page-home') {
    renderHome();
    showPage('page-home', 'slide-back');
  } else {
    renderFullList();
    showPage('page-list', 'slide-back');
  }
};

// 物联告警页返回执业反馈详情
$('#btn-back-iot-alarm').onclick = () => {
  const item = iotAlarmSourceItem;
  if (item) {
    if (!item._viewedLinks) item._viewedLinks = {};
    item._viewedLinks[LINK_IOT_ALARM] = true;
    showToast('已查看「查看物联告警」');
    renderDetail(item);
  }
  iotAlarmSourceItem = null;
  showPage('page-detail', 'slide-back');
};

// Card click delegation
document.addEventListener('click', e => {
  const card = e.target.closest('.card') || e.target.closest('.home-list-row');
  if (!card) return;
  const id = parseInt(card.dataset.id);
  const item = allItems.find(i => i.id === id);
  if (!item) return;

  const parentPage = card.closest('.page');
  if (parentPage.id === 'page-home') {
    navStack = ['page-home'];
  } else if (parentPage.id === 'page-list') {
    navStack.push('page-list');
  }
  renderDetail(item);
  showPage('page-detail', 'slide-in');
});

// Search input
let searchTimer = null;
$('#search-input').addEventListener('input', e => {
  const val = e.target.value.trim();
  $('#search-clear').classList.toggle('show', val.length > 0);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchKeyword = val; renderFullList(); }, 250);
});
$('#search-clear').onclick = () => {
  $('#search-input').value = '';
  $('#search-clear').classList.remove('show');
  searchKeyword = '';
  renderFullList();
};

// Filter dropdowns toggle
$('#filter-tag-btn').onclick = e => {
  e.stopPropagation();
  $('#filter-time-dropdown').classList.remove('show');
  $('#filter-tag-dropdown').classList.toggle('show');
};
$('#filter-time-btn').onclick = e => {
  e.stopPropagation();
  $('#filter-tag-dropdown').classList.remove('show');
  $('#filter-time-dropdown').classList.toggle('show');
};
$('#filter-tag-dropdown').onclick = e => e.stopPropagation();
$('#filter-time-dropdown').onclick = e => e.stopPropagation();
document.addEventListener('click', () => {
  $('#filter-tag-dropdown').classList.remove('show');
  $('#filter-time-dropdown').classList.remove('show');
});

// ============================== INIT ==============================
renderHome();
</script>
</body>
</html>
